workflows:
  ios-compile-check:
    name: showaCity iOS compile check
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      flutter: 3.44.8
      xcode: 26.4
      cocoapods: default
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Format check
        script: dart format --output=none --set-exit-if-changed lib test
      - name: Analyze
        script: flutter analyze
      - name: Test
        script: flutter test --reporter expanded --concurrency=1
      - name: Build unsigned iOS app
        script: flutter build ios --release --no-codesign
    artifacts:
      - build/ios/iphoneos/**/*.app
      - /tmp/xcodebuild_logs/*.log

  ios-testflight:
    name: showaCity iOS TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 120
    integrations:
      app_store_connect: showaCity-codemagic
    environment:
      flutter: 3.44.8
      xcode: 26.4
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.hashi.showaCity
      vars:
        BUNDLE_ID: com.hashi.showaCity
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Format check
        script: dart format --output=none --set-exit-if-changed lib test
      - name: Analyze
        script: flutter analyze
      - name: Test
        script: flutter test --reporter expanded --concurrency=1
      - name: Apply iOS signing profiles
        script: xcode-project use-profiles
      - name: Build signed IPA
        script: |
          flutter build ipa --release \
            --build-number=$PROJECT_BUILD_NUMBER \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
